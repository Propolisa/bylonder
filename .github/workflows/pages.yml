name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Blender's module for this tree: published by an earlier build, or built now (blender-wasm.yml).
  module:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.check.outputs.key }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key=$(node scripts/module.mjs key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          gh release view "$key" >/dev/null 2>&1 && echo published=true >> "$GITHUB_OUTPUT" || echo published=false >> "$GITHUB_OUTPUT"

  # A module build is never cancelled by a newer push: the newer run waits for it, as both need the same release.
  build-module:
    needs: module
    if: needs.module.outputs.published != 'true'
    concurrency:
      group: module-${{ needs.module.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/blender-wasm.yml

  # A newer push supersedes an older run's site build and deploy.
  build:
    needs: [module, build-module]
    if: ${{ !failure() && !cancelled() }}
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Packages download binaries from GitHub releases (ffmpeg), which answer 5xx at times.
      - run: for i in 1 2 3; do npm ci && exit 0; sleep 30; done; exit 1
      - uses: actions/cache@v4
        with:
          path: .tools/playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      # apt and the browser download fail at times on GitHub's runners; retry as npm ci does.
      - run: for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; sleep 30; done; exit 1
      - run: npm run module
      - run: npm test
      # Files Babylon loads from its CDNs, served by the app (scripts/babylon-assets.mjs), pinned by hash.
      - uses: actions/cache@v4
        with:
          path: |
            public/webgpu
            public/babylon-assets
          key: babylon-assets-${{ hashFiles('scripts/babylon-assets.mjs') }}
      - run: npm run build
        env:
          BASE_PATH: ./
          NODE_OPTIONS: --max-old-space-size=6144
      # Blender's demo files served by the site itself, as blender.org sends no CORS headers (src/workspace/demo-files.js).
      - uses: actions/cache@v4
        with:
          path: dist/blender-demo-files
          key: blender-demo-files-${{ hashFiles('src/workspace/blender-demo-files.json') }}
      - run: node scripts/demo-files.mjs
      # Some failures only happen in the production build: boot it in headless Chromium, open the menus and every
      # workspace, and fail before deploying on any page or console error (tests/e2e/prod.mjs).
      - name: Check the production build
        timeout-minutes: 30
        run: npm run test:prod
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # As the build: a skipped module build (the module is already released) must not skip the deploy.
  deploy:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

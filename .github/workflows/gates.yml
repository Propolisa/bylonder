name: Gates

# The gates before main (scripts/gates.mjs) on GitHub's runners, each part on a machine of its own: one production
# build, then the unit tests, the e2e smoke tests and the workflows in shards on that build, and the production check.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # The tests' hooks (__bylonder.settled); the deployed build (pages.yml) has none.
          VITE_TEST_HOOKS: 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: ['smoke 0/3', 'smoke 1/3', 'smoke 2/3', 'workflows 0/2', 'workflows 1/2', 'prod']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.63.0
      - run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: ${{ matrix.run }}
        timeout-minutes: 30
        run: |
          set -- ${{ matrix.run }}
          if [ "$1" = prod ]; then node tests/e2e/prod.mjs; else SHARD=$2 node tests/e2e/$1.mjs; fi

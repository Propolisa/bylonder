name: Blender WebAssembly build

# Blender built as Blender builds itself, for wasm32 (tools/blender-port/blender_build.py): its libraries compiled in
# parallel jobs, each keeping its objects in the Actions cache (an unchanged source is never compiled twice), then
# linked and reported (seam-report.json: what does not compile and what nothing defines). The module and the files its
# CPython reads (python313.zip, scripts.zip, addons.zip) are published as the release module-<tools/blender-port tree hash>
# (scripts/module.mjs), which the Pages deploy calls this for when missing.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

env:
  SHARDS: 8

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-18 lld-18 llvm-18 wasi-libc libclang-rt-18-dev-wasm32 libc++-18-dev-wasm32 libc++abi-18-dev-wasm32 ninja-build git-lfs && pip install libclang==18.1.1
      - uses: actions/cache@v4
        with:
          path: work/wasm-build
          key: blender-wasm-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: blender-wasm-${{ matrix.shard }}-
      # Blender's source at the manifest's tag with its LFS datafiles, kept between runs: its LFS server times out at times.
      - uses: actions/cache@v4
        with:
          path: work/blender
          key: blender-source-${{ hashFiles('tools/blender-port/manifest.json', 'tools/blender-port/wasm/patches/*.patch') }}
      # A failed LFS pull leaves a clone the script would not pull again, so a retry starts from no clone.
      - name: Configure Blender
        run: for i in 1 2 3; do bash tools/blender-port/configure_host.sh work && exit 0; rm -rf work/blender; sleep 60; done; exit 1
      - name: Compile shard ${{ matrix.shard }}
        run: SHARD=${{ matrix.shard }}/$SHARDS python3 tools/blender-port/blender_build.py work/build-host
      - uses: actions/upload-artifact@v4
        with:
          name: objects-${{ matrix.shard }}
          path: work/wasm-build/objects
          retention-days: 3

  link:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-18 lld-18 llvm-18 wasi-libc libclang-rt-18-dev-wasm32 libc++-18-dev-wasm32 libc++abi-18-dev-wasm32 ninja-build git-lfs && pip install libclang==18.1.1
      # Blender's source at the manifest's tag with its LFS datafiles, kept between runs: its LFS server times out at times.
      - uses: actions/cache@v4
        with:
          path: work/blender
          key: blender-source-${{ hashFiles('tools/blender-port/manifest.json', 'tools/blender-port/wasm/patches/*.patch') }}
      # The dependencies the link builds (CPython, numpy, FFTW) take minutes; each is rebuilt when its script or inputs change.
      - uses: actions/cache@v4
        with:
          path: work/wasm-build/deps
          key: blender-wasm-deps-${{ hashFiles('tools/blender-port/manifest.json', 'tools/blender-port/deps/**', 'tools/blender-port/wasm/patches/deps/*') }}
      # A failed LFS pull leaves a clone the script would not pull again, so a retry starts from no clone.
      - name: Configure Blender
        run: for i in 1 2 3; do bash tools/blender-port/configure_host.sh work && exit 0; rm -rf work/blender; sleep 60; done; exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: objects-*
          path: work/wasm-build/objects
          merge-multiple: true
      - name: Link and report
        run: python3 tools/blender-port/blender_build.py work/build-host --report seam-report.json
      # Sources that include a host header instead of the module's (non-blocking until the WASI-only sysroot lands).
      - name: Host headers
        continue-on-error: true
        run: cd tools/blender-port && python3 host_headers.py ../../work/build-host
      - name: Publish the module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key=$(node scripts/module.mjs key)
          cp work/wasm-build/bylonder.wasm bmesh.wasm
          cp work/wasm-build/bylonder-names.wasm bmesh-names.wasm
          cp work/wasm-build/python/python313.zip work/wasm-build/python/scripts.zip work/wasm-build/python/addons.zip .
          gh release view "$key" >/dev/null 2>&1 || gh release create "$key" bmesh.wasm bmesh-names.wasm python313.zip scripts.zip addons.zip --latest=false \
            --title "$key" --notes "Blender's module built from tools/blender-port at ${{ github.sha }}." --target "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-wasm
          path: |
            seam-report.json
            work/wasm-build/replaced.json
            work/wasm-build/*.wasm

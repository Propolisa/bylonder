<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basic Character</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:clamp(13px,2.2vmin,18px)/1.4 system-ui,sans-serif;color:#eee}
canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
#help{position:fixed;left:16px;bottom:16px;max-width:calc(100vw - 32px);padding:.4em .7em;border-radius:.5em;background:#0008}
#help small{display:block;opacity:.7}
#status{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center;white-space:pre-wrap}
#status.failed{color:#f88}
#status[hidden]{display:none}
@media (pointer:coarse){#help .keys{display:none}}
</style>
<script type="importmap">{ "imports": { "@babylonjs/core/": "https://cdn.jsdelivr.net/npm/@babylonjs/core@8.32.0/" } }</script>
<canvas id="c"></canvas>
<div id="status">Loading…</div>
<script>
// A failure while loading shows on the page, not only in the console.
const failed = (reason) => { const status = document.getElementById('status'); if (status) { status.hidden = false; status.className = 'failed'; status.textContent = `Could not load the scene: ${reason?.message ?? reason}`; } };
addEventListener('error', (e) => failed(e.error ?? e.message));
addEventListener('unhandledrejection', (e) => failed(e.reason));
</script>
<div id="help"><span class="keys">WASD or arrows to move, Shift to run, Space to jump, drag to look.</span>
<small>Mannequin and motion: Quaternius' Universal Animation Library, CC0. Scenery: Quaternius' Stylized Nature MegaKit, CC0.</small></div>
<script type="module" src="./game.js"></script>

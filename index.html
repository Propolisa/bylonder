<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="logo/bylonder-32.svg"><link rel="icon" type="image/png" sizes="32x32" href="logo/bylonder-32.png"><link rel="apple-touch-icon" href="logo/bylonder-256.png">
    <title>Bylonder</title>
  </head>
  <body>
    <header id="appbar">
      <span class="bl-logo"></span><nav id="topbar-menus" aria-label="Main menu"></nav>
      <nav id="workspace-tabs" aria-label="Workspaces"></nav>
      <span class="spacer"></span>
      <span class="bl-datablock bl-scene-selector" title="Scene"><span class="bl-icon" style="mask-image:url(icons/blender/scene_data.svg);-webkit-mask-image:url(icons/blender/scene_data.svg)"></span><select id="scene" aria-label="Scene"></select><span id="scene-actions"></span></span>
      <span class="bl-datablock bl-scene-selector" title="View Layer"><span class="bl-icon" style="mask-image:url(icons/blender/renderlayers.svg);-webkit-mask-image:url(icons/blender/renderlayers.svg)"></span><select id="view-layer" aria-label="View Layer"></select><span id="view-layer-actions"></span></span>
      <details id="app-more" hidden><summary aria-label="Project actions">⋯</summary><div>
        <select id="project" aria-label="Project"></select>
        <button id="share-project">Share project</button><button id="stop">Stop scene</button>
        <button id="new-project">New project</button><button id="fork-project">Fork project</button><button id="rename-project">Rename project</button>
        <button id="checkpoint">Checkpoint</button><button id="export">Export project ZIP</button><button id="import">Import project ZIP</button>
        <button id="toggle-remember">Remember scene edits: off</button><button id="clear-scene-edits">Clear scene edits</button><button id="layout">Arrange panels</button><button id="render-settings">Render resolution</button>
        <label><input type="checkbox" id="auto-run">Auto-run</label>
        <a id="app-source" href="app-source.zip" download="babylon-workbench-source.zip">Source</a>
      </div></details>
    </header>
    <div id="workspace">
      <aside id="explorer">
        <nav>
          <button id="files-tab" class="active">Files</button
          ><button id="history-tab">History</button>
        </nav>
        <div id="file-actions">
          <button id="new-file" title="New file">+ File</button
          ><button id="new-folder" title="New folder">+ Folder</button
          ><button id="upload" title="Upload assets">↑</button>
        </div>
        <div id="file-tree"></div>
        <div id="version-list" hidden></div>
        <div class="explorer-bottom">
          <button id="request-persist">Request durable storage</button
          ><span id="quota">Checking storage…</span>
        </div>
      </aside>
      <section id="code-pane">
        <div id="tabs"></div><div id="code-actions"><button id="run" title="Run Script (Ctrl Enter)"><span class="bl-icon" style="mask-image:url(icons/blender/play.svg);-webkit-mask-image:url(icons/blender/play.svg)"></span>Run Script</button><button data-code-action="undo">Undo</button><button data-code-action="redo">Redo</button><button data-code-action="editor.action.indentLines">Indent</button><button data-code-action="editor.action.outdentLines">Outdent</button><button data-code-action="editor.action.triggerSuggest">Suggest</button><button data-code-action="actions.find">Find</button><button data-code-action="editor.action.formatDocument">Format</button></div>
        <div id="editor-container"></div>
        <div id="diff-container" hidden></div>
        <div id="diff-actions" hidden>
          <span id="diff-label"></span
          ><button id="restore">Restore snapshot</button
          ><button id="close-diff">Close diff</button>
        </div>
      </section>
      <div
        id="splitter"
        role="separator"
        aria-label="Resize editor"
        tabindex="0"
      ></div>
      <section id="preview-pane">
        <div id="preview-toolbar" hidden>
          <label
            title="Persist interactive transforms, groups and all generated control values"
            ><input type="checkbox" id="remember" />Remember scene edits</label
          ><button id="clear-overrides">Clear overrides</button>
        </div>
        <div id="frame-host"><p>Run index.js to create the scene.</p></div>
      </section>
    </div>
    <section id="output">
      <nav>
        <button id="console-tab" class="active">Console</button
        ><button id="problems-tab">
          Problems <span id="problem-count">0</span></button
        ><button id="types-tab">Types</button><span class="spacer"></span
        ><button id="clear-console">Clear</button>
      </nav>
      <div id="console-content"></div>
      <div id="problems-content" hidden></div>
      <pre id="types-content" hidden></pre>
    </section>
    <footer class="bl-statusbar">
      <span id="status-hints"></span>
      <span class="bl-status-right"><span id="scene-stats"></span><span id="run-status">Starting…</span><span id="save-status" role="status">Opening OPFS…</span><span id="active-file">index.js</span><span id="type-status">Loading IntelliSense…</span><span id="storage-status">Local workspace</span></span>
    </footer>
    <input type="file" id="import-input" accept=".zip" hidden /><input
      type="file"
      id="upload-input"
      multiple
      hidden
    />
    <div id="fatal" hidden></div>
    <script type="module" src="/src/workspace/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bylonder Scene</title>
  </head>
  <body>
    <main>
      <canvas id="viewport" tabindex="0" aria-label="Interactive 3D viewport"></canvas>
      <div id="panel"><div id="outliner" class="bl-outliner"></div></div>
      <div id="pane"></div>
      <div id="gesture-cursor" hidden aria-hidden="true">+</div>
      <div id="gesture-guide" hidden aria-hidden="true"></div>
      <div id="toast" role="status"></div>
      <div id="creation-panel" hidden></div>
      <div id="redo-panel" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
